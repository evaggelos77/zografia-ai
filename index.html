<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ζωγραφιά με Ζωή AI</title>
  <meta name="description" content="Η ζωγραφιά του παιδιού ζωντανεύει: μιλάει, αφηγείται μια χαρούμενη ιστορία και ακούγεται με γυναικεία AI φωνή στα Ελληνικά." />
  <meta name="theme-color" content="#ff6cc7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ζωγραφιά" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-stars"></div>
    <div class="bg-blob blob-a"></div>
    <div class="bg-blob blob-b"></div>
    <div class="bg-blob blob-c"></div>
  </div>

  <button id="installBtn" type="button" hidden title="Εγκατάσταση" aria-label="Install"
    style="position:fixed;top:14px;right:14px;z-index:9999;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:62px;background:rgba(255,255,255,.92);border:1px solid #e8c4ff;color:#7b3fff;border-radius:14px;padding:6px 10px;line-height:1;cursor:pointer;box-shadow:0 8px 22px rgba(123,63,255,.25);font-weight:900">
    <span style="font-size:18px;font-weight:900">⇩</span>
    <span style="font-size:10px;letter-spacing:.4px">Install</span>
  </button>

  <main id="app" aria-live="polite"></main>

  <!-- File inputs: kept off-screen (NOT 'hidden' — iOS Safari blocks .click() on hidden file inputs) -->
  <input id="fileInput"   type="file" accept="image/*"
         style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px;pointer-events:none" />
  <input id="cameraInput" type="file" accept="image/*" capture="environment"
         style="position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px;pointer-events:none" />
  <canvas id="resizeCanvas" style="display:none"></canvas>
  <canvas id="captureCanvas" style="display:none"></canvas>

  <!-- Live Κάμερα overlay (getUserMedia) — fullscreen, top-level above everything -->
  <div id="cameraOverlay" hidden
       style="position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:2147483647;background:rgba(15,10,30,.97);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;margin:0">

    <!-- Top bar: title + big close X -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)">
      <div style="color:#fff;font-weight:900;font-size:17px;text-shadow:0 1px 4px rgba(0,0,0,.6)">📷 Φωτογράφισε τη ζωγραφιά</div>
      <button id="cameraCloseBtn" type="button" aria-label="Κλείσιμο"
              style="background:#ff4d6d;color:#fff;border:0;border-radius:14px;min-width:90px;height:46px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(255,77,109,.45);padding:0 14px">✕ Άκυρο</button>
    </div>

    <!-- Error box (red, prominent) -->
    <div id="cameraError" hidden
         style="background:#ff4d6d;color:#fff;padding:12px 16px;font-weight:800;text-align:center;font-size:15px;line-height:1.4"></div>

    <!-- Video: fills available area -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;min-height:0;position:relative">
      <video id="cameraVideo" autoplay playsinline muted
             style="width:100%;height:100%;object-fit:contain;background:#000"></video>
      <!-- Tip overlay when video is black -->
      <div id="cameraTip"
           style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;font-weight:700;text-shadow:0 2px 8px #000;pointer-events:none;font-size:14px">
        Πάτα <b>Allow</b> για να δεις την κάμερα.<br>
        <small style="opacity:.7">Αν δεν εμφανιστεί, πάτα «Άλλη κάμερα» ή «Άκυρο».</small>
      </div>
    </div>

    <!-- Bottom controls -->
    <div style="display:flex;gap:10px;align-items:center;justify-content:center;padding:18px 14px 28px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)">
      <button id="cameraSwitchBtn" type="button" aria-label="Άλλη κάμερα"
              style="background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;width:56px;height:56px;font-size:22px;cursor:pointer">🔄</button>
      <button id="cameraCaptureBtn" type="button"
              style="background:linear-gradient(135deg,#ff6cc7,#ffa84d);color:#fff;border:0;border-radius:999px;padding:18px 36px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 12px 32px rgba(255,108,199,.55);min-width:200px">📸 Τράβα</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    (function () {
      let deferred = null;
      const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      const btn = document.getElementById('installBtn');
      function show() { if (btn && !standalone) btn.hidden = false; }
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; show(); });
      window.addEventListener('appinstalled', () => { if (btn) btn.hidden = true; });
      if (!standalone) show();
      if (btn) btn.addEventListener('click', async () => {
        if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; btn.hidden = true; return; }
        alert("📲 Εγκατέστησε τη Ζωγραφιά με Ζωή σαν εφαρμογή:\n\n📱 iPhone (Safari): πάτα «Κοινή χρήση» (το τετράγωνο με ↑) → «Προσθήκη στην οθόνη Αφετηρίας».\n🤖 Android (Chrome): μενού ⋮ → «Εγκατάσταση εφαρμογής».\n💻 Υπολογιστής (Chrome/Edge): το εικονίδιο εγκατάστασης στη γραμμή διεύθυνσης, ή μενού → «Εγκατάσταση εφαρμογής».\n\nΘα γίνει εικονίδιο στην οθόνη και θα ανοίγει σε πλήρη οθόνη — σαν κανονικό app!");
      });
    })();
  </script>
</body>
</html>
